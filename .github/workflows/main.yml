name: Compilar ERPNext com Webshop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descarregar codigo base oficial
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Definir Webshop e dependencias
        run: |
          cd frappe_docker
          echo '[
            {"url": "https://github.com/frappe/erpnext", "branch": "version-16"},
            {"url": "https://github.com/frappe/payments", "branch": "version-16"},
            {"url": "https://github.com/frappe/webshop", "branch": "version-16"}
          ]' > apps.json

      - name: Detetar caminhos dos Containerfiles
        id: detect
        working-directory: frappe_docker
        run: |
          # Procura o Containerfile do Backend
          WORKER_PATH=$(find images/custom -type f \( -name 'Containerfile' -o -name 'worker.Dockerfile' \) | head -n 1)
          
          # Procura o Containerfile do Frontend/Nginx
          NGINX_PATH=$(find images/custom -type f \( -name '*nginx*Containerfile*' -o -name '*nginx*.Dockerfile' \) | head -n 1)

          # Fallback para os caminhos padrão mais recentes caso o find falhe
          if [ -z "$WORKER_PATH" ]; then WORKER_PATH="images/custom/Containerfile"; fi
          if [ -z "$NGINX_PATH" ]; then NGINX_PATH="images/custom/nginx/Containerfile"; fi

          echo "WORKER_FILE=$WORKER_PATH" >> $GITHUB_ENV
          echo "NGINX_FILE=$NGINX_PATH" >> $GITHUB_ENV
          echo "Backend Containerfile: $WORKER_PATH"
          echo "Frontend Containerfile: $NGINX_PATH"

      - name: Compilar e Publicar Imagens
        working-directory: frappe_docker
        run: |
          export APPS_JSON_BASE64=$(base64 -w 0 apps.json)
          export REPO_OWNER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          
          # Compilar o Backend
          docker build \
            --build-arg=APPS_JSON_BASE64=$APPS_JSON_BASE64 \
            --tag=ghcr.io/$REPO_OWNER/erpnext-backend:v16 \
            --file=$WORKER_FILE .
            
          # Compilar o Frontend (Assets)
          docker build \
            --build-arg=APPS_JSON_BASE64=$APPS_JSON_BASE64 \
            --tag=ghcr.io/$REPO_OWNER/erpnext-frontend:v16 \
            --file=$NGINX_FILE .
            
          # Enviar para o registo
          docker push ghcr.io/$REPO_OWNER/erpnext-backend:v16
          docker push ghcr.io/$REPO_OWNER/erpnext-frontend:v16
