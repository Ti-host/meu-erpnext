name: Compilar ERPNext com Webshop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descarregar codigo base oficial
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Definir Webshop e dependencias
        run: |
          cd frappe_docker
          echo '[
            {"url": "https://github.com/frappe/erpnext", "branch": "version-16"},
            {"url": "https://github.com/frappe/payments", "branch": "version-16"},
            {"url": "https://github.com/frappe/webshop", "branch": "version-16"}
          ]' > apps.json

      - name: Detectar Containerfiles
        id: detect
        working-directory: frappe_docker
        shell: bash
        run: |
          set -euo pipefail
          WORKER_PATH="$(
            find images -type f \( \
              -name 'Containerfile' -o \
              -name 'worker.Dockerfile' -o \
              -name 'Dockerfile' \
            \) | head -n 1
          )"

          NGINX_PATH="$(
            find images -type f \( \
              -iname '*nginx*.Containerfile' -o \
              -iname '*nginx*.Dockerfile' -o \
              -iname 'nginx.Containerfile' -o \
              -iname 'nginx.Dockerfile' \
            \) | head -n 1
          )"

          if [ -z "$WORKER_PATH" ]; then
            echo "Backend Containerfile not found."
            find images -maxdepth 3 -type f -print
            exit 1
          fi

          if [ -z "$NGINX_PATH" ]; then
            echo "Nginx Containerfile not found in frappe_docker."
            echo "Available image files:"
            find images -maxdepth 4 -type f -print
            exit 1
          fi

          echo "WORKER_FILE=$WORKER_PATH" >> "$GITHUB_ENV"
          echo "NGINX_FILE=$NGINX_PATH" >> "$GITHUB_ENV"

          echo "Backend Containerfile: $WORKER_PATH"
          echo "Frontend Containerfile: $NGINX_PATH"

      - name: Compilar e Publicar Imagens
        working-directory: frappe_docker
        shell: bash
        run: |
          set -euo pipefail
          export APPS_JSON_BASE64="$(base64 -w 0 apps.json)"
          export REPO_OWNER="$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')"

          docker build \
            --build-arg "APPS_JSON_BASE64=$APPS_JSON_BASE64" \
            --tag "ghcr.io/$REPO_OWNER/erpnext-backend:v16" \
            --file "$WORKER_FILE" \
            .

          docker build \
            --build-arg "APPS_JSON_BASE64=$APPS_JSON_BASE64" \
            --tag "ghcr.io/$REPO_OWNER/erpnext-frontend:v16" \
            --file "$NGINX_FILE" \
            .

          docker push "ghcr.io/$REPO_OWNER/erpnext-backend:v16"
          docker push "ghcr.io/$REPO_OWNER/erpnext-frontend:v16"
